font_family      Adwaita Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

window_padding_width 3

font_size 12.0

background_opacity 1.0

# Neutral ash surfaces instead of pure black.
background            #1A1A1A
foreground            #E1D7C5
selection_background  #363636
selection_foreground  #E1D7C5
cursor                #9B78CA
cursor_text_color     #1A1A1A

# ANSI palette. Slot 0/8 default to pure black — lifted to the ash ramp so
# black-on-black text stays readable against the new background.
# black
color0  #242424
color8  #363636
# red
color1  #B16262
color9  #C47B7B
# green
color2  #61BD88
color10 #7CCF9D
# yellow
color3  #C2A85E
color11 #D4BB78
# blue
color4  #6193BB
color12 #7FA9CD
# magenta / primary
color5  #9B78CA
color13 #B193D8
# cyan
color6  #61B4BB
color14 #7CC8CE
# white
color7  #E1D7C5
color15 #F0EDF3
